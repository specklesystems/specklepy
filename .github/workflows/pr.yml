  test-public: # Run integration tests against the public server image
    name: Test (public)
    runs-on: ubuntu-latest
    env:
      IS_PUBLIC: "true"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-extras --dev

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pinned to v5.0.5
        with:
          path: ~/.cache/pre-commit/
          key: ${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Run Speckle Server
        run: docker compose --file docker-compose.yml up --detach --wait

      - name: Run tests
        run: uv run pytest --cov --cov-report xml:reports/coverage.xml --junitxml=reports/test-results.xml

      - name: Minimize uv cache
        run: uv cache prune --ci

  bundle-spec-conformance: # verify the vendored spec pin + validate an emitted bundle (atlas ADR-0004)
    name: Bundle spec conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: specklepy

      - name: Read the bundle-spec pin
        id: pin
        run: echo "commit=$(jq -r .commit specklepy/src/specklepy/bundle/spec/BUNDLE_SPEC_PIN.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: specklesystems/speckle-bundle-spec
          ref: ${{ steps.pin.outputs.commit }}
          path: speckle-bundle-spec
          token: ${{ secrets.CONNECTORS_GH_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the duckdb CLI
        run: |
          curl -fsSLo duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip duckdb
          sudo install -m 755 duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "specklepy/uv.lock"

      - name: Install the project
        working-directory: specklepy
        run: uv sync --extra bundle --dev

      - name: Verify the vendored spec matches the pin
        working-directory: speckle-bundle-spec
        run: |
          npm ci
          npm run publish:artifacts
          npm run verify-pin -- --python ../specklepy/src/specklepy/bundle/spec

      - name: Emit a bundle and validate it against the spec
        working-directory: specklepy
        env:
          SPECKLE_BUNDLE_SPEC_DIR: ${{ github.workspace }}/speckle-bundle-spec
          SPECKLE_BUNDLE_FIXTURE_DIR: ${{ runner.temp }}/bundle-fixture
        run: uv run pytest tests/bundle/test_conformance.py -q -rs
