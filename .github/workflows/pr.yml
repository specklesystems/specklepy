  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
      CONNECTORS_GH_TOKEN:
        required: true
  pull_request:
    branches:
      - "main"

permissions: {} # no permissions by default, override on a per-job basis

concurrency:
  group: ${{ github.workflow }}-pr-test-${{ github.ref }}
  cancel-in-progress: true

