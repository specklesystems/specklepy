# Minimum colors for the risk check (risk-check/ in specklesystems/.github). A
# changed file that matches a path here gets at least that color, plus one
# comment that someone answers like an approver finding. Paths match from the
# repo root: "*" stays inside one directory, "**" spans any number of them.
# Everything under .github/ is red whatever this file says. A pull request that
# leaves this file unreadable fails the risk check.
yellow:
  # Agent configuration
  - '**/AGENTS.md'
  - '**/CLAUDE.md'
  - agents/**
  - '**/.agents/**'
  - '**/.claude/**'
  - '**/.codex/**'
  - '**/.omp/**'
  # Authentication and secrets code: accounts, tokens, and where the token is
  # sent to the server
  - src/specklepy/api/credentials.py
  - src/specklepy/core/api/credentials.py
  - src/specklepy/api/client.py
  - src/specklepy/transports/server/retry_policy.py
  - src/specklepy/bundle/upload.py
  - src/specklepy/bundle/download.py
  # Betterleaks exceptions
  - '**/.betterleaks.toml'
  - '**/.betterleaksignore'
  - '**/.gitleaksignore'
  # Docs site: Netlify builds main into the public docs with the build_docs
  # task of mise.toml
  - netlify.toml
  - mise.toml
  # CI configuration outside .github/ (disabled today)
  - .circleci/**
red:
  - .github/**
# Machine accounts with write access: their color reviews and approvals never count.
bots:
  - SpeckleDevBot
