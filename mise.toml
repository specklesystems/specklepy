[tools]
python = "3.13.7"
uv = "0.9.11"

[settings]
experimental = true
python.uv_venv_auto = true


[tasks.install]
# --reinstall-package: re-run hatch_build.py so a moved ../speckle-bundle-spec checkout is
# picked up (uv otherwise reuses the cached editable build when this repo is unchanged).
run= "uv sync --all-extras --all-groups --reinstall-package specklepy"


[tasks.install_docs]
run= "uv sync --group docs"

[tasks.build_docs]
description = "Build static docs "
run = "uv run mkdocs build"
depends = ['install_docs']

[tasks.test]
run = "uv run pytest"


[env]
IS_PUBLIC = "false"
